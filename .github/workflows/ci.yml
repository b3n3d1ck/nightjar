name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit + component tests
        run: npm test

      - name: Production build
        run: npm run build

      # Gates the build: a high/critical vuln in a *production* dependency fails CI.
      - name: Dependency audit (production — gating)
        run: npm audit --omit=dev --audit-level=high

      # Visible but non-blocking: dev-tool advisories (e.g. the test runner's
      # internals) are surfaced as a warning, not a build failure.
      - name: Dependency audit (dev — advisory)
        run: npm audit --audit-level=critical || echo "::warning::dev-only dependency advisories present"
